INHERIT: mkdocs-base.yml

site_name: NestSpace ユーザーマニュアル
site_url: https://chuccp.github.io/NestSpace/ja/
site_description: 'NestSpace：Android 上でアプリレベルの仮想空間を実現。マルチインスタンス、データ分離、AI アシスタント、MCP 制御に対応。'

docs_dir: docs-ja
site_dir: site-ja

theme:
